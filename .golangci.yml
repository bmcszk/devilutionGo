version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - govet
    - errcheck
    - bodyclose
    - misspell
    - staticcheck
    - unused
    - ineffassign
    - unparam
    - dupl
    - nestif
    - revive
    - testpackage
    - thelper
  exclusions:
    rules:
      - path: '(.+)_test\.go$'
        linters:
          - errcheck
          - unparam
          # Test files use the same package for white-box access; the
          # black-box `pkg_test` rename is rejected as architectural churn.
          - testpackage
          # Complexity/shape findings in test helpers are tolerated by
          # decision: table-driven tests and asserts are complex by nature.
          - revive
      - path: '(^|/)demo/format\.go$'
        linters:
          - revive
  settings:
    revive:
      enable-all-rules: true
      rules:
      - name: package-comments
        disabled: true
      - name: package-directory-mismatch
        disabled: true
      - name: add-constant
        disabled: true
        exclude: ["**/*_test.go"]
        arguments:
          - max-lit-count: "3"
            allow-strs: '""'
            allow-ints: "0"
            allow-floats: "0.0"
      - name: var-naming
        disabled: true
      - name: line-length-limit
        arguments: [120]
      - name: function-length
        arguments: [100, 0]
      - name: file-length-limit
        arguments:
          - max: 1000
            skip-comments: false
            skip-blank-lines: false
      - name: unhandled-error
        exclude: ["**/*_test.go"]
      - name: exported
        disabled: true
      - name: max-public-structs
        disabled: true
    nestif:
      min-complexity: 4

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
