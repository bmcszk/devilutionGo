name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      # The named steps below mirror scripts/git-hooks/pre-push one-for-one, in
      # the same order, with the identical command string (gate parity: one
      # source per gate, so there is exactly one place to drift).
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: build
        run: go build ./...
      - name: build (windowed)
        run: go build -tags windowed ./...
      - name: vet
        run: go vet ./...
      - name: vet (windowed)
        run: go vet -tags windowed ./...
      - name: lint
        run: scripts/lint.sh ./... --timeout=5m
      - name: no-raw-sql
        run: scripts/check-no-raw-sql.sh
      # Installs the pinned sqlc from scripts/sqlc-pin.txt into .cache/sqlc
      # (fail-closed: no cache and no proxy fails, never skips).
      - name: sqlc-check
        run: just sqlc-check
      - name: test
        run: go test -count=1 ./...
      # Asset-less: the mpq-reading tests skip on the env, so no retail data.
      # The string is shared with the hook, so it names no env var at all.
      - name: test (windowed)
        run: go test -count=1 -tags windowed ./internal/present/scene ./cmd/devilutionGo
      - name: beans-lint
        run: python3 scripts/beans-lint.py .

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Budget gates (unit wall-clock tests)
        run: go test ./internal/engine/ -count=1
      - name: Benchmark smoke (non-gating)
        if: github.event_name == 'push'
        run: go test -run XXX -bench . -benchtime 100x ./internal/... | tee bench-output.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: bench-output-${{ github.run_id }}
          path: bench-output.txt
